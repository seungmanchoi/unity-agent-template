# Module Builder Agent

게임 규칙을 `Game.Domain` 의 순수 C# 모듈로 만들고 테스트를 함께 남긴다. 어셈블리 레이어 규칙을 지킨다.

## 레이어 (asmdef)

```
Game.Domain        unity/Assets/Game/Domain        순수 C#, noEngineReferences: true, 참조 없음
Game.Platform      unity/Assets/Game/Platform      → Domain           (SDK·네이티브 브리지)
Game.Presentation  unity/Assets/Game/Presentation  → Domain, Platform (MonoBehaviour, uGUI, 입력)
Game.Editor        unity/Assets/Game/Editor        → 위 전부          (batchmode 생성기·빌드)
Game.Tests.EditMode unity/Assets/Game/Tests/EditMode → Domain
```

`npm run verify`(check-harness)가 참조 방향을 검사한다. 새 어셈블리가 필요하면 위 다섯 개로 해결되지 않는 이유를 먼저 적는다 — 대부분은 폴더로 충분하다.

## Pre-Work Contract — `_workspace/spec.md` 우선 읽기 (MANDATORY)

1. `_workspace/spec.md` 의 `monetization`, `ux.store_review`, `ux.onboarding`, `backend` Read + 해당 `*_notes`, `project.context`
2. `_workspace/plan/module-map.md`, 해당 `docs/specs/<feature>/` Read

분기:
- `ux.store_review=true` → Domain `Review/ReviewPolicy.cs` (순수 정책 엔진, 상태와 현재 시각을 인자로 받음) + 테스트
- `monetization.model` 에 광고 → Domain 에 광고 빈도 정책(쿨다운·일일 cap 계산)만. SDK 호출은 platform-integrator
- `ux.onboarding≠none` → 튜토리얼 단계 상태 머신을 Domain 에
- `*_notes` 가 객관식보다 우선. 모호하면 `AskUserQuestion` (`execution.unattended: true` 면 `on_ambiguity` 정책)
- spec 에서 꺼진 기능의 모듈은 만들지 않는다

## Rules (Domain)
- `using UnityEngine` / `UnityEditor` 금지 (asmdef `noEngineReferences: true`)
- **결정적**: 고정 스텝(`GameSim.StepsPerSecond = 60` 패턴)으로 진행, 프레임 시간에 의존하지 않는다
- **난수**: 시드 `Rng`(xorshift32)만. `System.Random`, `UnityEngine.Random` 금지
- **시계 없음**: `DateTime.Now/UtcNow`, `Stopwatch`, `Environment.TickCount` 금지 — 시각·날짜는 호출자가 넘긴다 (로컬 날짜 키는 Presentation/Platform 에서 `DateTime.Now.ToString("yyyy-MM-dd")`)
- 입력은 의미 단위로 받는다(예: `Tap(x, y)` 아레나 단위). 화면 좌표 변환은 Presentation
- 상태는 공개 읽기 전용 프로퍼티, 튜닝 값은 `*Rules` 클래스 필드
- C# 9 (Unity 6 = `DomainTests~` LangVersion 9). `record`·`init` 은 Unity 에서 쓰지 않는다
- 네임스페이스 `Game.Domain.<Module>` (init 후 `<Ns>.Domain.<Module>`)

## Output

```
unity/Assets/Game/Domain/<Module>/
├── <Module>Sim.cs       # 고정 스텝 시뮬레이션 (필요할 때)
├── <Module>Rules.cs     # 튜닝 값
└── <Module>Types.cs     # enum·struct
unity/Assets/Game/Tests/EditMode/<Module>Tests.cs
```

테스트 최소 세트: 같은 시드 같은 결과, 핵심 판정의 경계값(안/밖), 종료 조건, 종료 뒤 입력 무시.

```bash
npm test                 # dotnet test unity/DomainTests~ — Unity 라이선스 없이
npm run verify           # check-harness + Domain 테스트
```

`.cs` 를 새로 만들면 `.meta` 는 Unity 가 만든다(`npm run unity -- generate` 한 번). `.meta` 를 손으로 쓰거나 GUID 를 고치지 않는다. 생성된 `.meta` 는 커밋한다.

