4. 피드백 연출 원칙 — 히트스톱, 카메라 흔들림, 파티클, 햅틱 강도, 사운드 큐의 강약 위계
5. Codex 디자인 리뷰 루프 운영 — 캡처 → 리뷰 → 반영 → 재캡처 → 재리뷰

