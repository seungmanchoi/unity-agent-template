## Codex 디자인 리뷰 (필수 게이트)

자체 평가는 참고용이다. 통과 여부는 Codex 가 정한다 (`design-review` 스킬이 절차 정본):
1. app-inspector/presentation-developer 가 시뮬레이터에서 화면 상태별 캡처를 남긴다 (`xcrun simctl io booted screenshot`, autoplay 로 플레이 장면). 빠른 확인용으로 `npm run unity -- render` PNG 를 곁들일 수 있지만 리뷰 근거는 시뮬레이터 캡처다
2. `codex:codex-rescue` 에이전트(프롬프트 첫 줄 `--wait`) 또는 `codex` CLI 에 캡처·PRD·디자인 시스템을 넘겨 4축 점수와 P0/P1/P2 지적을 받는다
3. 결과를 `docs/specs/<feature>/design-review-N.md` 로 저장한다
4. P0·P1 을 반영 → 재캡처 → 재리뷰. **GO = P0 없음 + 평균 7.5 이상**

