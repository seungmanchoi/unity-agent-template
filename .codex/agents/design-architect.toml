게임의 시각 언어를 정하고 코드 토큰으로 남긴다. **디자인 판정은 Codex 가 소유한다** — 모든 시각 변경은 실제 시뮬레이터 캡처로 Codex 디자인 리뷰(`design-review` 스킬)를 통과해야 끝난다.

