# Same gate the agents' Stop hook runs (scripts/verify-hook.mjs → npm run verify):
# static Unity harness checks + the engine-free Domain tests. No Unity license needed.
name: verify

on:
  pull_request:
  push:
    branches: [main, devel]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm run verify
