# =============================================================================
# Pre-flight Survey Spec Template (Unity game)
# =============================================================================
# 사용법: 이 파일을 `_workspace/spec.md` 로 복사 → 필드를 채움 → /orchestrate
# spec.md 가 있으면 orchestrate 가 survey 를 건너뛰고 Phase 1 로 간다.
#
# 스키마 약속:
#   - 객관식 필드는 `<field>_notes` 자유 입력을 가질 수 있고, 비어 있지 않으면 객관식보다 우선한다
#   - `project.context` 는 톤·레퍼런스 게임·제약 메모. 모든 Phase 가 항상 읽는다
#   - execution.unattended: true 면 체크포인트에서 멈추지 않고 `_workspace/decisions.log` 에 기록한다
# =============================================================================

project:
  name: ""                       # [필수] 앱 슬러그 (AppInfo.Slug 와 같다)
  context: |                     # 자유 입력
    # 예: 한 손가락 세로 액션. Furi 의 읽기→방어→반격 리듬, Fruit Ninja 의 즉시성.
    # 한 판 60~90초. 광고는 판 사이에만.

execution:
  unattended: false              # true 면 체크포인트·조건부 질문도 자동 결정
  on_ambiguity: pick_recommended # pick_first | pick_recommended | ask
  idea_selection: ask            # ask | 1 | 2 | 3 | recommended
  design_selection: ask          # ask | recommended | 1 | 2 | 3

# A. 게임 콘셉트
game:
  genre: ""                      # [필수] action | puzzle | hypercasual | rhythm | idle | roguelike | ...
  genre_notes: ""
  core_loop: ""                  # [필수] 한 줄 (예: 예고를 읽고 → 막고 → 반격해 → 약점을 연다)
  session_length: 1-3min         # [필수] under-30s | 1-3min | 5min+
  input: tap                     # [필수] tap | swipe | drag | hold | mixed
  orientation: portrait          # [필수] portrait | landscape
  meta: best_score               # [조건부] none | best_score | levels | upgrades
  meta_notes: ""

# B. 아트·사운드
art:
  direction: ""                  # [필수] minimal-shapes | 2d-parts | pixel | 2.5d
  direction_notes: ""
  source: shared-library         # [필수] shared-library (game-assets/aether) | generated | provided
  audio: sfx_and_bgm             # [필수] sfx_and_bgm | sfx_only | none
  haptics: true                  # [필수]

# C. 측정
measurement:
  firebase_analytics: true       # [필수] Firebase Unity Analytics
  crashlytics: true              # [필수]
  north_star: ""                 # [필수] 비우면 LLM 이 추천 (예: 완주한 판 수 / DAU)
  north_star_notes: ""

# D. 수익화
monetization:
  model: none                    # [필수] none | ads | iap | ads_plus_iap
  model_notes: ""
  ad_formats: []                 # [조건부] banner | interstitial | rewarded | app_open
  interstitial_every_n: 3        # [조건부] N판마다, 첫 판 제외
  rewarded_use: ""               # [조건부] continue | double_reward | item
  iap_products: []               # [조건부] remove_ads | currency | skin

# E. UX·정책·배포
ux:
  languages: [en, ko]            # [필수]
  tutorial: practice_round       # [필수] none | practice_round | guided_steps
  store_review: false            # [필수]
  store_review_triggers: []      # [조건부] 예: [after_first_win, after_new_best]

policy:
  age_rating: "4+"               # [필수] 4+ | 9+ | 12+ | 17+
  children_under_13: false       # [조건부] true 면 맞춤 광고 금지
  privacy_url: auto-github-pages # [필수] auto-github-pages | <직접 URL>

deployment:
  platforms: [ios, android]      # [필수] [ios] | [android] | [ios, android]
  beta_channel: testflight       # [필수] testflight | internal_testing | both
  aso: llm-generated             # [조건부] llm-generated | manual
